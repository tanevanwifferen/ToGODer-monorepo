name: togoder-prod

services:
  togoder:
    build:
      context: .
      dockerfile: Dockerfile
    image: togoder-monorepo:prod
    container_name: togoder-prod
    env_file:
      - .env
    environment:
      - PORT=${PORT:-6969}
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/dev.db}
      - HOST_URL=${HOST_URL:-http://localhost:${PORT:-6968}}
      - PREVIOUS_DEFAULT_MODEL=${PREVIOUS_DEFAULT_MODEL:-mistralai/ministral-8b-2512}
    ports:
      - "${PORT:-6969}:${PORT:-6969}"
    volumes:
      - ../backend/data:/app/data
    restart: unless-stopped
